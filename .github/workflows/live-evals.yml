# Live evals (AGENTS.md > Definition of done, EVALS.md). Manual, main only.
# Calls EXTRACT_MODEL on Vertex (EU multi-region) for at most budgets.json liveEvalMaxCalls cases,
# within liveEvalMaxCostUsd. Signs in as github-evals (Vertex only). Run after a merge that
# changes prompts, schema, rules or src/models, and log the result. Pull requests that change
# them already run evals:live in pr.yml.
name: live-evals

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-evals
  cancel-in-progress: false

jobs:
  live-evals:
    name: live-evals
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EXTRACT_PROVIDER: ${{ vars.EXTRACT_PROVIDER }}
      EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
      VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
      VERTEX_REGION: ${{ vars.VERTEX_REGION }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_EVALS_PROVIDER }}
          service_account: ${{ vars.GCP_EVALS_SA }}
      - run: npm run evals:live -- --media
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-evals
          path: |
            evals/runs/summary.json
            evals/runs/recorded/
          retention-days: 30
