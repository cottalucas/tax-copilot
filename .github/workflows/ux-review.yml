# Screenshot UX review (AGENTS.md > Pipeline). Comments only, never blocks.
# Runs after pr.yml with base branch code only. It reads the screenshots pr.yml saved as an
# artifact (untrusted data: PNG checked, size and count capped) and never runs pull request code.
name: ux-review

on:
  workflow_run:
    workflows: [pr]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  ux-review:
    name: ux-review
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHECK_PROVIDER: ${{ vars.CHECK_PROVIDER }}
      CHECK_MODEL: ${{ vars.CHECK_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
      VERTEX_REGION: ${{ vars.VERTEX_REGION }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - id: shots
        name: Download screenshots, if this pull request changed screens
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ux-shots
          path: ${{ runner.temp }}/ux-shots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        if: steps.shots.outcome == 'success'
      - uses: ./.github/actions/setup
        if: steps.shots.outcome == 'success'
      - uses: google-github-actions/auth@v3
        if: steps.shots.outcome == 'success' && vars.CHECK_PROVIDER == 'vertex'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Review the screenshots
        if: steps.shots.outcome == 'success'
        run: npm run ux-review -- review "$RUNNER_TEMP/ux-shots"
