# Nightly (AGENTS.md > Pipeline): full test:e2e and the government form change check.
# Live evals are manual and main only (live-evals.yml).
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: test:e2e (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  form-change:
    name: government form change check
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder until the canton is chosen
        run: |
          echo "::notice title=form change check::Placeholder. Waits for the canton decision (PRD.md, Open questions)."
          echo "Plan: fetch the canton form, hash its field map, compare with forms/<canton>.map.json, fail and open an issue on change."
