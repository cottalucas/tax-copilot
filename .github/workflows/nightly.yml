# Nightly (AGENTS.md > Pipeline): full test:e2e, live evals with rotation (every case runs live
# within two nights, about 0.01 USD a night) and the government form change check.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: test:e2e (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  live-evals:
    name: evals:live (rotating)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXTRACT_PROVIDER: ${{ vars.EXTRACT_PROVIDER }}
      EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
      VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
      VERTEX_REGION: ${{ vars.VERTEX_REGION }}
      EVAL_OFFSET: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_EVALS_PROVIDER }}
          service_account: ${{ vars.GCP_EVALS_SA }}
      - run: npm run evals:live

  form-change:
    name: government form change check
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder until the canton is chosen
        run: |
          echo "::notice title=form change check::Placeholder. Waits for the canton decision (PRD.md, Open questions)."
          echo "Plan: fetch the canton form, hash its field map, compare with forms/<canton>.map.json, fail and open an issue on change."
