# Manual infra setup and deploy. Actions > infra > Run workflow.
# Keyless: Workload Identity Federation, no service account key (ARCHITECTURE.md > Keyless deploy identity).
# Needs variables: FIREBASE_PROJECT_ID, FIRESTORE_LOCATION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA.
# FIRESTORE_LOCATION can never change after the database exists. A human confirms it first.
name: infra

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Deploy Cloud Functions (needs the Blaze plan)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  infra:
    name: infra
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      FIRESTORE_LOCATION: ${{ vars.FIRESTORE_LOCATION }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
    steps:
      - name: Check inputs
        run: |
          missing=""
          [ -z "$WIF_PROVIDER" ] && missing="$missing GCP_WIF_PROVIDER"
          [ -z "$DEPLOY_SA" ] && missing="$missing GCP_DEPLOY_SA"
          [ -z "$PROJECT" ] && missing="$missing FIREBASE_PROJECT_ID"
          [ -z "$FIRESTORE_LOCATION" ] && missing="$missing FIRESTORE_LOCATION"
          if [ -n "$missing" ]; then
            echo "::error title=infra blocked::Missing variables:$missing. See ARCHITECTURE.md > Keyless deploy identity."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Enable APIs
        run: |
          gcloud services enable --project "$PROJECT" \
            firestore.googleapis.com firebase.googleapis.com firebasehosting.googleapis.com \
            identitytoolkit.googleapis.com cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com \
            secretmanager.googleapis.com aiplatform.googleapis.com
      - name: Create Firestore database if missing
        run: |
          if gcloud firestore databases describe --database="(default)" --project "$PROJECT" >/dev/null 2>&1; then
            echo "Firestore (default) exists. Location stays as created."
          else
            gcloud firestore databases create --database="(default)" --location="$FIRESTORE_LOCATION" --type=firestore-native --project "$PROJECT"
          fi
      - name: Deploy rules, indexes and hosting
        run: npx firebase deploy --only firestore:rules,firestore:indexes,hosting --project "$PROJECT" --non-interactive
      - name: Deploy functions (europe-west6)
        if: inputs.deploy_functions
        run: npx firebase deploy --only functions --project "$PROJECT" --non-interactive --force
      - name: Health check
        if: inputs.deploy_functions
        run: curl --fail --silent "https://europe-west6-${PROJECT}.cloudfunctions.net/health"
