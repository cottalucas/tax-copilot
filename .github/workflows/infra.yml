# Manual infra setup. Actions > infra > Run workflow.
# Keyless: Workload Identity Federation, no key file (ARCHITECTURE.md > Keyless deploy identity).
# Setup only by default: APIs (incl. Drive), Firestore check, rules and indexes, Firebase Auth.
# Main only: it signs in as github-deployer.
# Live app deploy (hosting, functions) runs only when "deploy_app" is ticked.
# FIRESTORE_LOCATION can never change once the database exists. The job fails on a mismatch.
name: infra

on:
  workflow_dispatch:
    inputs:
      deploy_app:
        description: Also deploy hosting and functions to the live project
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  infra:
    name: infra
    # Signs in as github-deployer: main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      FIRESTORE_LOCATION: ${{ vars.FIRESTORE_LOCATION }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
    steps:
      - name: Check inputs
        run: |
          missing=""
          [ -z "$WIF_PROVIDER" ] && missing="$missing GCP_WIF_PROVIDER"
          [ -z "$DEPLOY_SA" ] && missing="$missing GCP_DEPLOY_SA"
          [ -z "$PROJECT" ] && missing="$missing FIREBASE_PROJECT_ID"
          [ -z "$FIRESTORE_LOCATION" ] && missing="$missing FIRESTORE_LOCATION"
          if [ -n "$missing" ]; then
            echo "::error title=infra blocked::Missing variables:$missing. See ARCHITECTURE.md > Keyless deploy identity."
            exit 1
          fi
          # Stack is locked (AGENTS.md > Never do): Firestore lives in europe-west6, whatever the variable says.
          if [ "$FIRESTORE_LOCATION" != "europe-west6" ]; then
            echo "::error title=infra blocked::FIRESTORE_LOCATION is $FIRESTORE_LOCATION. The locked stack requires europe-west6."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Enable APIs
        run: |
          gcloud services enable --project "$PROJECT" \
            firestore.googleapis.com firebase.googleapis.com firebaserules.googleapis.com \
            firebasehosting.googleapis.com identitytoolkit.googleapis.com storage.googleapis.com \
            firebasestorage.googleapis.com
      - name: Firestore in the expected location
        run: |
          loc=$(gcloud firestore databases describe --database="(default)" --project "$PROJECT" --format="value(locationId)" 2>/dev/null || true)
          if [ -z "$loc" ]; then
            gcloud firestore databases create --database="(default)" --location="$FIRESTORE_LOCATION" --type=firestore-native --project "$PROJECT"
            loc="$FIRESTORE_LOCATION"
          fi
          if [ "$loc" != "$FIRESTORE_LOCATION" ]; then
            echo "::error title=firestore::Firestore (default) is in $loc, expected $FIRESTORE_LOCATION. Locations never change."
            exit 1
          fi
          echo "Firestore (default) is in $loc."
          echo "### Firestore: \`(default)\` in $loc" >> "$GITHUB_STEP_SUMMARY"
      # SR-28: client documents stay in the default bucket only while a return is open. Lucas creates
      # it once in europe-west6 with the 28 day rule (ARCHITECTURE.md > Files). Checked every run.
      - name: Documents bucket in Zurich, private, deleting after 28 days
        run: |
          bucket="gs://${PROJECT}.firebasestorage.app"
          if ! gcloud storage buckets describe "$bucket" --format=json > bucket.json 2> bucket.err; then
            echo "::error title=bucket::$bucket is missing or not readable. Lucas creates it (ARCHITECTURE.md > Files)."
            cat bucket.err; exit 1
          fi
          python3 - <<'PY'
          import json, sys
          b = json.load(open("bucket.json"))
          want = json.load(open("storage-lifecycle.json"))["rule"]
          got = (b.get("lifecycle_config") or b.get("lifecycle") or {}).get("rule", [])
          errors = []
          if b.get("location", "").lower() != "europe-west6": errors.append(f"location is {b.get('location')}, expected europe-west6")
          if b.get("public_access_prevention") != "enforced": errors.append("public access prevention is not enforced")
          if got != want: errors.append(f"lifecycle is {got}, expected {want} (storage-lifecycle.json)")
          # Deleted means gone: no soft delete window that keeps documents recoverable.
          if int((b.get("soft_delete_policy") or {}).get("retentionDurationSeconds", 0) or 0) != 0: errors.append("soft delete is on; deleted documents would stay recoverable")
          for e in errors: print(f"::error title=bucket::{e}")
          if errors: sys.exit(1)
          print("Bucket: europe-west6, private, deletes documents after 28 days, no soft delete.")
          PY
          echo "### Documents bucket: europe-west6, private, 28 day deletion, no soft delete" >> "$GITHUB_STEP_SUMMARY"
      # Extracted values expire 27 days after the oldest upload (src/functions/extract.ts). The
      # deploy goes on only once the TTL policy is ACTIVE, so no values are saved without it.
      - name: Extracted values expire (Firestore TTL active)
        run: |
          ttl_state() { gcloud firestore fields ttls list --project "$PROJECT" --format="value(name,ttlConfig.state)" 2>/dev/null | grep "collectionGroups/extraction/fields/expireAt" | awk '{print $2}' || true; }
          state=$(ttl_state)
          if [ "$state" != "ACTIVE" ] && [ "$state" != "CREATING" ]; then
            gcloud firestore fields ttls update expireAt --collection-group=extraction --enable-ttl --project "$PROJECT" --async
          fi
          for _ in $(seq 1 60); do
            state=$(ttl_state)
            [ "$state" = "ACTIVE" ] && break
            sleep 15
          done
          if [ "$state" != "ACTIVE" ]; then
            echo "::error title=firestore ttl::The TTL policy on extraction.expireAt is $state, not ACTIVE, after 15 minutes. Run infra again."
            exit 1
          fi
          echo "### Firestore TTL on extraction.expireAt: ACTIVE" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Firestore and Storage rules, Firestore indexes
        run: npx firebase deploy --only firestore:rules,firestore:indexes,storage --project "$PROJECT" --non-interactive
      - name: Turn on Firebase Auth
        run: |
          token=$(gcloud auth print-access-token)
          api="https://identitytoolkit.googleapis.com"
          auth=(-H "Authorization: Bearer $token" -H "x-goog-user-project: $PROJECT")
          code=$(curl -s -o /dev/null -w "%{http_code}" "${auth[@]}" "$api/admin/v2/projects/$PROJECT/config")
          if [ "$code" = "404" ]; then
            curl -sf -X POST "${auth[@]}" -H "content-type: application/json" -d '{}' \
              "$api/v2/projects/$PROJECT/identityPlatform:initializeAuth" > /dev/null
            echo "Firebase Auth initialized."
          fi
          curl -sf "${auth[@]}" "$api/admin/v2/projects/$PROJECT/config" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('Auth config:', d['name'])"
          google=$(curl -s -o /dev/null -w "%{http_code}" "${auth[@]}" "$api/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs/google.com")
          if [ "$google" = "200" ]; then
            echo "### Firebase Auth: on. Google sign-in: on." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=google sign-in::Google sign-in is off. It needs an OAuth client from the consent screen (Lucas)."
            echo "### Firebase Auth: on. Google sign-in: off, waits for the OAuth consent screen (Lucas)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enable app APIs (live deploy)
        if: inputs.deploy_app
        run: |
          gcloud services enable --project "$PROJECT" cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com \
            cloudscheduler.googleapis.com pubsub.googleapis.com
      # The web app's public config (not a secret) is written at deploy time, never committed.
      - name: Register the web app and write its public config
        if: inputs.deploy_app
        run: |
          id=$(npx firebase apps:list WEB --project "$PROJECT" --json | jq -r '.result[0].appId // empty')
          if [ -z "$id" ]; then
            id=$(npx firebase apps:create WEB tax-copilot-web --project "$PROJECT" --json | jq -r '.result.appId')
          fi
          npx firebase apps:sdkconfig WEB "$id" --project "$PROJECT" --json | jq -r '.result.sdkConfig |
            "VITE_FIREBASE_API_KEY=\(.apiKey)\nVITE_FIREBASE_AUTH_DOMAIN=\(.authDomain)\nVITE_FIREBASE_PROJECT_ID=\(.projectId)\nVITE_FIREBASE_APP_ID=\(.appId)\nVITE_FIREBASE_STORAGE_BUCKET=\(.storageBucket)"' > web/.env.production.local
      # Product AI settings for the functions, from repository variables (names only in the repo).
      # EXTRACT_ALLOWED_EMAILS: the only accounts that may run extraction. Missing stops the deploy.
      - name: Write the functions' settings
        if: inputs.deploy_app
        env:
          EXTRACT_PROVIDER: ${{ vars.EXTRACT_PROVIDER }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
          VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
          VERTEX_REGION: ${{ vars.VERTEX_REGION }}
          EXTRACT_ALLOWED_EMAILS: ${{ vars.EXTRACT_ALLOWED_EMAILS }}
        run: |
          : > ".env.$PROJECT"
          for v in EXTRACT_PROVIDER EXTRACT_MODEL VERTEX_PROJECT_ID VERTEX_REGION EXTRACT_ALLOWED_EMAILS; do
            if [ -z "${!v}" ]; then echo "::error title=functions settings::Repository variable $v is not set."; exit 1; fi
            printf '%s=%s\n' "$v" "${!v}" >> ".env.$PROJECT"
          done
      - name: Deploy hosting and functions (live)
        if: inputs.deploy_app
        run: npx firebase deploy --only hosting,functions --project "$PROJECT" --non-interactive --force
      - name: Health check
        if: inputs.deploy_app
        run: curl --fail --silent "https://europe-west6-${PROJECT}.cloudfunctions.net/health"
