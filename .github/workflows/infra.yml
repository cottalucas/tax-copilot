# Manual infra setup. Actions > infra > Run workflow.
# Keyless: Workload Identity Federation, no key file (ARCHITECTURE.md > Keyless deploy identity).
# Setup only by default: APIs (incl. Drive), Firestore check, rules and indexes, Firebase Auth.
# Main only: it signs in as github-deployer.
# Live app deploy (hosting, functions) runs only when "deploy_app" is ticked.
# FIRESTORE_LOCATION can never change once the database exists. The job fails on a mismatch.
name: infra

on:
  workflow_dispatch:
    inputs:
      deploy_app:
        description: Also deploy hosting and functions to the live project
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  infra:
    name: infra
    # Signs in as github-deployer: main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      FIRESTORE_LOCATION: ${{ vars.FIRESTORE_LOCATION }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
    steps:
      - name: Check inputs
        run: |
          missing=""
          [ -z "$WIF_PROVIDER" ] && missing="$missing GCP_WIF_PROVIDER"
          [ -z "$DEPLOY_SA" ] && missing="$missing GCP_DEPLOY_SA"
          [ -z "$PROJECT" ] && missing="$missing FIREBASE_PROJECT_ID"
          [ -z "$FIRESTORE_LOCATION" ] && missing="$missing FIRESTORE_LOCATION"
          if [ -n "$missing" ]; then
            echo "::error title=infra blocked::Missing variables:$missing. See ARCHITECTURE.md > Keyless deploy identity."
            exit 1
          fi
          # Stack is locked (AGENTS.md > Never do): Firestore lives in europe-west6, whatever the variable says.
          if [ "$FIRESTORE_LOCATION" != "europe-west6" ]; then
            echo "::error title=infra blocked::FIRESTORE_LOCATION is $FIRESTORE_LOCATION. The locked stack requires europe-west6."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Enable APIs
        run: |
          gcloud services enable --project "$PROJECT" \
            firestore.googleapis.com firebase.googleapis.com firebaserules.googleapis.com \
            firebasehosting.googleapis.com identitytoolkit.googleapis.com drive.googleapis.com
      - name: Firestore in the expected location
        run: |
          loc=$(gcloud firestore databases describe --database="(default)" --project "$PROJECT" --format="value(locationId)" 2>/dev/null || true)
          if [ -z "$loc" ]; then
            gcloud firestore databases create --database="(default)" --location="$FIRESTORE_LOCATION" --type=firestore-native --project "$PROJECT"
            loc="$FIRESTORE_LOCATION"
          fi
          if [ "$loc" != "$FIRESTORE_LOCATION" ]; then
            echo "::error title=firestore::Firestore (default) is in $loc, expected $FIRESTORE_LOCATION. Locations never change."
            exit 1
          fi
          echo "Firestore (default) is in $loc."
          echo "### Firestore: \`(default)\` in $loc" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Firestore rules and indexes
        run: npx firebase deploy --only firestore:rules,firestore:indexes --project "$PROJECT" --non-interactive
      - name: Turn on Firebase Auth
        run: |
          token=$(gcloud auth print-access-token)
          api="https://identitytoolkit.googleapis.com"
          auth=(-H "Authorization: Bearer $token" -H "x-goog-user-project: $PROJECT")
          code=$(curl -s -o /dev/null -w "%{http_code}" "${auth[@]}" "$api/admin/v2/projects/$PROJECT/config")
          if [ "$code" = "404" ]; then
            curl -sf -X POST "${auth[@]}" -H "content-type: application/json" -d '{}' \
              "$api/v2/projects/$PROJECT/identityPlatform:initializeAuth" > /dev/null
            echo "Firebase Auth initialized."
          fi
          curl -sf "${auth[@]}" "$api/admin/v2/projects/$PROJECT/config" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('Auth config:', d['name'])"
          google=$(curl -s -o /dev/null -w "%{http_code}" "${auth[@]}" "$api/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs/google.com")
          if [ "$google" = "200" ]; then
            echo "### Firebase Auth: on. Google sign-in: on." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=google sign-in::Google sign-in is off. It needs an OAuth client from the consent screen (Lucas)."
            echo "### Firebase Auth: on. Google sign-in: off, waits for the OAuth consent screen (Lucas)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enable app APIs (live deploy)
        if: inputs.deploy_app
        run: |
          gcloud services enable --project "$PROJECT" cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com
      # The web app's public config (not a secret) is written at deploy time, never committed.
      - name: Register the web app and write its public config
        if: inputs.deploy_app
        run: |
          id=$(npx firebase apps:list WEB --project "$PROJECT" --json | jq -r '.result[0].appId // empty')
          if [ -z "$id" ]; then
            id=$(npx firebase apps:create WEB tax-copilot-web --project "$PROJECT" --json | jq -r '.result.appId')
          fi
          npx firebase apps:sdkconfig WEB "$id" --project "$PROJECT" --json | jq -r '.result.sdkConfig |
            "VITE_FIREBASE_API_KEY=\(.apiKey)\nVITE_FIREBASE_AUTH_DOMAIN=\(.authDomain)\nVITE_FIREBASE_PROJECT_ID=\(.projectId)\nVITE_FIREBASE_APP_ID=\(.appId)"' > web/.env.production.local
      - name: Deploy hosting and functions (live)
        if: inputs.deploy_app
        run: npx firebase deploy --only hosting,functions --project "$PROJECT" --non-interactive --force
      - name: Health check
        if: inputs.deploy_app
        run: curl --fail --silent "https://europe-west6-${PROJECT}.cloudfunctions.net/health"
