# Auto merge (AGENTS.md > Pipeline). Turns on GitHub auto merge for every pull request from a
# branch of this repo that is not a draft. GitHub merges it (squash) once every required check
# passes. Fork pull requests never auto merge: the repo is public, and forks get no secrets, so
# their evals and review fail and they stay blocked.
name: automerge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: automerge
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
