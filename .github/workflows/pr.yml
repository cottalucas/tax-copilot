# Every pull request (AGENTS.md > Pipeline). No human QA: a pull request halts when any gate fails.
# Required on main: changes, check, test:unit, test:integration, test:e2e, evals, audit, review,
# and codeql (codeql.yml). ux-shots and ux-review.yml comment only and are not required.
# A missing secret or variable fails the job: keys are in, so nothing skips silently.
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      screens: ${{ steps.filter.outputs.screens }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            screens:
              - 'web/**'
              - 'DESIGN.md'

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check

  # Full unit suite on every pull request, with the coverage floor (coverage-floor.json) and the
  # Cloud Function duration budget (budgets.json).
  unit:
    name: test:unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the base branch for the coverage floor check
        run: git fetch --depth=1 origin "$GITHUB_BASE_REF"
      - uses: ./.github/actions/setup
      - run: npm run test:unit

  integration:
    name: test:integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup
      - run: npm run test:integration

  # Full Playwright suite on every pull request, including the WCAG 2.2 AA accessibility checks.
  e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Golden set and prompt injection set on every pull request (Linear SR-15). Fails above the
  # model cost budget in budgets.json.
  evals:
    name: evals
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      APP_MODEL: ${{ vars.APP_MODEL }}
      EVAL_MODELS: ${{ vars.EVAL_MODELS }}
    steps:
      - name: Check secrets and variables
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] || [ -z "$APP_MODEL" ]; then
            echo "::error title=evals blocked::OPENROUTER_API_KEY secret or APP_MODEL variable is not set."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run evals

  # Dependency audit: production dependencies, high and critical fail the pull request.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high

  review:
    name: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
    steps:
      - name: Check secrets and variables
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$REVIEWER_MODEL" ]; then
            echo "::error title=review blocked::OPENAI_API_KEY secret or REVIEWER_MODEL variable is not set."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The reviewer, its rules, AGENTS.md and TASKS.md come only from the base commit, never from
      # the pull request, so a pull request cannot change the reviewer that judges it.
      - name: Load the reviewer from the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          t="$RUNNER_TEMP/trusted"
          mkdir -p "$t/scripts"
          for f in AGENTS.md TASKS.md scripts/review-rules.md scripts/review-prompt.mjs scripts/post-review.mjs; do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then git show "$BASE_SHA:$f" > "$t/$f"; fi
          done
          echo "Reviewer loaded from base commit $BASE_SHA."
      - name: Build review prompt
        env:
          TRUSTED_DIR: ${{ runner.temp }}/trusted
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node "$RUNNER_TEMP/trusted/scripts/review-prompt.mjs" > "$RUNNER_TEMP/review-prompt.md"
      - name: Codex review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.REVIEWER_MODEL }}
          prompt-file: ${{ runner.temp }}/review-prompt.md
          output-file: ${{ runner.temp }}/review.md
          sandbox: read-only
          # Run Codex in the trusted folder, so it never loads the pull request's own AGENTS.md.
          # The diff is in the prompt.
          working-directory: ${{ runner.temp }}/trusted
      # Posts or updates one comment. Blocks only on a tagged [CRITERION], [NEVER] or [SECURITY]
      # reason, and fails closed on malformed output.
      - name: Post one review comment and gate on the verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: node "$RUNNER_TEMP/trusted/scripts/post-review.mjs" "$RUNNER_TEMP/review.md"

  # Screenshots for the UX review. Only when screen files change. No secrets, read only token:
  # this job runs pull request code. ux-review.yml (base code) sends them to the model.
  ux-shots:
    name: ux-shots
    needs: changes
    if: needs.changes.outputs.screens == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - name: Serve the app and take screenshots
        run: |
          npm run build:web
          npx vite preview --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:4173 npm run ux-review -- shots ux-shots
      - uses: actions/upload-artifact@v7
        with:
          name: ux-shots
          path: ux-shots/*.png
          retention-days: 3
