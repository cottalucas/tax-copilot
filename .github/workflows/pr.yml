# Every pull request (QA.md). Every job here is a required check on main.
# No human QA: a pull request halts when tests, evals or review fail.
# Path filtered jobs always run and report a status, so the branch rule can require them.
# A missing secret or variable fails the job: keys are in, so nothing skips silently.
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      evals: ${{ steps.filter.outputs.evals }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'web/**'
              - 'src/**'
              - 'rules/**'
              - 'tests/e2e/**'
              - 'firebase.json'
              - 'firestore.rules'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'playwright.config.ts'
            evals:
              - 'prompts/**'
              - 'src/schema/**'
              - 'src/extraction/**'
              - 'src/models/**'
              - 'rules/**'
              - 'evals/**'

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check

  unit:
    name: test:unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:unit

  integration:
    name: test:integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup
      - run: npm run test:integration

  e2e:
    name: test:e2e
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip when app code did not change
        if: needs.changes.outputs.app != 'true'
        run: echo "::notice title=test:e2e skipped::No app code changed in this pull request."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.app == 'true'
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.app == 'true'
      - if: needs.changes.outputs.app == 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.changes.outputs.app == 'true'
        run: npm run test:e2e

  evals:
    name: evals
    needs: changes
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      APP_MODEL: ${{ vars.APP_MODEL }}
      EVAL_MODELS: ${{ vars.EVAL_MODELS }}
    steps:
      - id: gate
        run: |
          # Golden set runs on every pull request (Linear SR-15 wins over the Notion path filter).
          if [ -z "$OPENROUTER_API_KEY" ] || [ -z "$APP_MODEL" ]; then
            echo "::error title=evals blocked::OPENROUTER_API_KEY secret or APP_MODEL variable is not set."
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.run == 'true'
      - if: steps.gate.outputs.run == 'true'
        run: npm run evals

  review:
    name: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
    steps:
      - id: gate
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$REVIEWER_MODEL" ]; then
            echo "::error title=review blocked::OPENAI_API_KEY secret or REVIEWER_MODEL variable is not set."
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
      # The reviewer, its rules, AGENTS.md and TASKS.md come only from the base commit, never from
      # the pull request, so a pull request cannot change the reviewer that judges it.
      - name: Load the reviewer from the base commit
        if: steps.gate.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          t="$RUNNER_TEMP/trusted"
          mkdir -p "$t/scripts"
          for f in AGENTS.md TASKS.md scripts/review-rules.md scripts/review-prompt.mjs scripts/post-review.mjs; do
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then git show "$BASE_SHA:$f" > "$t/$f"; fi
          done
          echo "Reviewer loaded from base commit $BASE_SHA."
      - name: Build review prompt
        if: steps.gate.outputs.run == 'true'
        env:
          TRUSTED_DIR: ${{ runner.temp }}/trusted
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node "$RUNNER_TEMP/trusted/scripts/review-prompt.mjs" > "$RUNNER_TEMP/review-prompt.md"
      - name: Codex review
        if: steps.gate.outputs.run == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.REVIEWER_MODEL }}
          prompt-file: ${{ runner.temp }}/review-prompt.md
          output-file: ${{ runner.temp }}/review.md
          sandbox: read-only
      # Posts or updates one comment, then fails the job on "Verdict: Changes requested".
      - name: Post one review comment and gate on the verdict
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: node "$RUNNER_TEMP/trusted/scripts/post-review.mjs" "$RUNNER_TEMP/review.md"
